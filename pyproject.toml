[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sstgam"
version = "0.3.0"
description = "Shared-Shape Temporal GAM for binary classification with wide longitudinal feature matrices."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Maitreya Mohapatra" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "gam",
    "generalized-additive-model",
    "longitudinal-data",
    "time-series",
    "interpretable-machine-learning",
    "classification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "scipy>=1.8",
]

[project.urls]
Homepage = "https://github.com/mimo1999/sstgam"
Repository = "https://github.com/mimo1999/sstgam"
Issues = "https://github.com/mimo1999/sstgam/issues"

[project.optional-dependencies]
dev = ["pandas>=1.5", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sstgam = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
